name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['ridelog.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ridelog.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: ridelog
      - run: npx expo prebuild --platform android --no-install
        working-directory: ridelog
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: ridelog/android
      - run: cp ridelog/android/app/build/outputs/apk/release/app-release.apk app-release.apk
      - uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: RideLog build ${{ github.run_number }}
          artifacts: app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell monkey -p com.ridelog.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell "pidof com.ridelog.app || echo NOT_RUNNING" > pid.txt
            adb logcat -d > logcat-full.txt
            adb exec-out screencap -p > screen.png
      - name: Show the result
        if: always()
        run: |
          {
            echo '## Smoke test result'
            echo "App process: $(cat pid.txt 2>/dev/null)"
            echo '### Crash lines'
            echo '```'
            grep -nE 'FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Fatal signal|SIGSEGV|UnsatisfiedLink|NoClassDefFound|ClassNotFound|com\.ridelog' logcat-full.txt 2>/dev/null | head -80 | cut -c1-300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            logcat-full.txt
            screen.png
