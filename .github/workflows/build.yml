name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['ridelog.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ridelog.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: ridelog
      - run: npx expo prebuild --platform android --no-install
        working-directory: ridelog
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: ridelog/android
      - uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: RideLog build ${{ github.run_number }}
          artifacts: ridelog/android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
